<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101210" />
    <meta name="description" content="A bright new thing is on its way. Stay tuned for our launch." />
    <title>Hello, tomorrow. | Coming soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="launch">
      <img
        class="launch__image"
        src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=2400&q=88"
        alt="A vivid nebula glowing with color against the night sky"
        fetchpriority="high"
      />
      <div class="launch__shade" aria-hidden="true"></div>
      <div class="launch__flare" aria-hidden="true"></div>

      <header class="topbar">
        <a class="wordmark" href="/" aria-label="Brightside home">
          <span class="wordmark__spark" aria-hidden="true"></span>
          <span>BRIGHTSIDE</span>
        </a>
        <p class="topbar__note">A new experience is taking shape</p>
      </header>

      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow"><span class="eyebrow__dot"></span> The next chapter starts here</p>
        <h1 id="welcome-title">Hello,<br /><span>tomorrow.</span></h1>
        <p class="welcome__copy">We're putting the finishing touches on something bright. Stay close; we'll be here soon.</p>
        <div class="launch-status">
          <span class="launch-status__line" aria-hidden="true"></span>
          <span>LAUNCHING SOON</span>
          <span class="launch-status__line" aria-hidden="true"></span>
        </div>
      </section>

      <footer class="bottom-bar">
        <span>GOOD THINGS ARE GLOWING</span>
        <span class="bottom-bar__right">A LITTLE PATIENCE, A LOT OF POSSIBILITY</span>
      </footer>
    </main>
  </body>
</html>
